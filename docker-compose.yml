services:
  pi-dashboard:
    build: .
    # Per usare l'immagine pubblicata invece di costruirla (arm64, armv7, amd64), sostituisci la riga "build: ." con:
    # image: ghcr.io/OWNER/pi-dashboard:latest   (e imposta SELF_IMAGE allo stesso nome)
    image: pi-dashboard:latest
    container_name: pi-dashboard
    restart: unless-stopped
    # La rete e i PID dell'host servono per vedere l'intera macchina (interfacce, processi).
    network_mode: host
    pid: host
    env_file: .env
    environment:
      SELF_IMAGE: pi-dashboard:latest
      SELF_CONTAINER_NAME: pi-dashboard
    volumes:
      - ./data:/data                         # database e chiave di sessione
      - /var/run/docker.sock:/var/run/docker.sock   # gestione container
      - /:/host:ro,rslave                    # sola lettura: spazio disco e info di sistema
